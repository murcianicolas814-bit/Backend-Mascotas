info:
  name: Registro Publico Usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombres": "Luisa Andrea",
        "apellidos": "Gómez Ruiz",
        "tipoDocumento": "CC",
        "documento": "1098765434",
        "correo": "luisa.gomez@correo.co",
        "telefono": "3151234561",
        "password": "Password123*",
        "rol": "ADMINISTRADOR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
