info:
  name: Registro Publico Usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombres": "Carol Andrea",
        "apellidos": "Gómez Ruiz",
        "tipoDocumento": "CC",
        "documento": "1098765435",
        "correo": "paula.gomez@correo.co",
        "telefono": "3151234568",
        "password": "Password123*",
        "direccion": "Calle 127 # 15 - 45, Bogotá",
        "consentimientoDatos": true,
        "contactoEmergencia": {
          "nombre": "Carlos Gómez",
          "telefono": "3109876543"
        }
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
