info:
  name: Login Usuario
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "correo": "paula.gomez@correo.co",
        "password": "Password123*"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
