info:
  name: Verifica Autenticacion
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auth/renew-token"
  headers:
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
