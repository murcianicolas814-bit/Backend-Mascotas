info:
  name: Eliminar Usuario
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/usuarios/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: ID_AQUI
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
