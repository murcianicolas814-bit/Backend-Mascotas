info:
  name: Listar Usuarios (Paginado y Filtro Status)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios?page=2&limit=2"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: page
      value: "2"
      type: query
    - name: limit
      value: "2"
      type: query
    - name: status
      value: "true"
      type: query
      disabled: true
    - name: rol
      value: RECEPCIONISTA
      type: query
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
