info:
  name: Obtener Usuario por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: "{{usuarioId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
