info:
  name: Actualizar Usuario
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/usuarios/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: "{{usuarioId}}"
      type: path
  body:
    type: json
    data: |
      {
        "nombres": "Carlos Alberto",
        "apellidos": "Martínez Actualizado",
        "telefono": "3109876543",
        "direccion": "Avenida Siempre Viva 742, Bogotá",
        "cargo": "Especialista Veterinario Senior",
        "especialidades": ["Cirugía General", "Traumatología"],
        "activo": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
