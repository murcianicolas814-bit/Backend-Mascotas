info:
  name: Listar Clientes
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/clientes?activo=true&pagina=1&limite=10"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: activo
      value: "true"
      type: query
    - name: pagina
      value: "1"
      type: query
    - name: limite
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
