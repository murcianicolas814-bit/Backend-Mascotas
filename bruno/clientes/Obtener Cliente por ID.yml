info:
  name: Obtener Cliente por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/clientes/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: "{{clienteId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
