info:
  name: Actualizar Empleado
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/empleados/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: ID_EMPLEADO_AQUI
      type: path
  body:
    type: json
    data: |-
      {
        "cargo": "Director Médico y Especialista",
        "especialidades": [
          "Cirugía General",
          "Dermatología Canina",
          "Ortopedia Veterinaria"
        ],
        "turno": "ROTATIVO",
        "activo": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
