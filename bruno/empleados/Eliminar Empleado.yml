info:
  name: Eliminar Empleado
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/empleados/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: "{{empleadoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
