info:
  name: Actualizar Producto
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/productos/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: ID_AQUI
      type: path
  body:
    type: json
    data: |
      {
        "precioVenta": 18000,
        "stockActual": 45,
        "estado": "Activo"
      }
