info:
  name: Crear Producto
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/productos"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |
      {
        "codigo": "MED-001",
        "nombre": "Amoxicilina 500mg Caninos/Felinos",
        "unidad": "TABLETA",
        "stockActual": 50,
        "stockMinimo": 10,
        "precioVenta": 15000,
        "estado": "Activo",
        "categoria": "ID_CATEGORIA_AQUI"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
