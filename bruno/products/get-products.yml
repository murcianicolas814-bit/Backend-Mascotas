info:
  name: Listar Productos
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/productos"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
