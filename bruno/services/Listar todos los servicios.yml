info:
  name: Listar todos los servicios
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/servicios?estado=todos&pagina=1&limite=10"
  params:
    - name: estado
      value: todos
      type: query
    - name: pagina
      value: "1"
      type: query
    - name: limite
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
