info:
  name: Listar todos los servicios
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/servicios?estado=todos
  params:
    - name: estado
      value: todos
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
