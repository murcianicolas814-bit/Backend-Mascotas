      value: "{{token}}"
  params:
    - name: id
      value: ID_AQUI
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
