info:
  name: Crear Categoria
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/categorias"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |
      {
        "nombre": "Medicamentos Veterinarios"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
