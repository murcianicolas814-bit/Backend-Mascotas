info:
  name: Actualizar Categoria
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/categorias/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: ID_AQUI
      type: path
  body:
    type: json
    data: |
      {
        "nombre": "Medicamentos e Insumos Actualizados"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
