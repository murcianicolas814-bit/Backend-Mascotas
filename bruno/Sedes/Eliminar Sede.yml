info:
  name: Eliminar Sede
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/sedes/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  params:
    - name: id
      value: "{{sedeId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
