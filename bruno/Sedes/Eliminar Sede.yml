info:
  name: Eliminar Sede
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/sedes/{{sedeId}}"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
