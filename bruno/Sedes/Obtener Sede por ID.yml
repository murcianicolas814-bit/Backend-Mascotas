info:
  name: Obtener Sede por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/sedes/{{sedeId}}"
  headers:
    - name: Accept
      value: application/json
    - name: X-Token
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
